apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
  namespace: datenna-demo
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4-system-trixie
  enableSuperuserAccess: true
  bootstrap:
    initdb:
      database: datenna
      owner: datenna_owner
      postInitApplicationSQL:
        - CREATE ROLE datenna_runtime NOLOGIN
        - GRANT CONNECT ON DATABASE datenna TO datenna_runtime
        - GRANT USAGE ON SCHEMA public TO datenna_runtime
        - CREATE TABLE public.stored_objects (id UUID PRIMARY KEY, object_key TEXT NOT NULL UNIQUE, content_type TEXT NOT NULL, size_bytes BIGINT NOT NULL CHECK (size_bytes >= 0), created_at TIMESTAMPTZ NOT NULL)
        - GRANT SELECT, INSERT, UPDATE, DELETE ON TABLE public.stored_objects TO datenna_runtime
  storage:
    size: 1Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

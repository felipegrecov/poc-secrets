apiVersion: v1
kind: ServiceAccount
metadata:
  name: datenna-app
  namespace: datenna-demo
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: datenna-app
  namespace: datenna-demo
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: datenna-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: datenna-app
    spec:
      serviceAccountName: datenna-app
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: datenna-app:openbao
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_HOST
              value: postgres-rw
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: datenna
            - name: POSTGRES_USER_FILE
              value: /var/run/secrets/datenna/postgres-username
            - name: POSTGRES_PASSWORD_FILE
              value: /var/run/secrets/datenna/postgres-password
            - name: MINIO_ENDPOINT
              value: minio:9000
            - name: MINIO_BUCKET
              value: datenna-objects
            - name: MINIO_SECURE
              value: "false"
            - name: MINIO_ACCESS_KEY_FILE
              value: /var/run/secrets/datenna/minio-access-key
            - name: MINIO_SECRET_KEY_FILE
              value: /var/run/secrets/datenna/minio-secret-key
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: application-secrets
              mountPath: /var/run/secrets/datenna
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: application-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: datenna-openbao
---
apiVersion: v1
kind: Service
metadata:
  name: datenna-app
  namespace: datenna-demo
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: datenna-app
  ports:
    - name: http
      port: 8000
      targetPort: http
      nodePort: 30080
